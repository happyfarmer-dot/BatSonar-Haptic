name: Build and Release BatSonar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatSonar-Haptic-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "BatSonar Haptic v1.0.0 (APK)"
          body: |
            ## 🦇 BatSonar Haptic v1.0.0
            Samsung Galaxy S24 Ultra FMCW 超聲波避障與 X 軸線性馬達觸覺聲納

            ### 📦 安裝說明
            - 下載下方 Assets 中的 `app-debug.apk`。
            - 於 Samsung Galaxy S24 Ultra 手機直接開啟安裝（若系統提示未知來源應用程式，請點擊允許安裝）。
            - 首次啟動請授予 `RECORD_AUDIO` 麥克風權限以接收 48 kHz 超聲波回波。
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
